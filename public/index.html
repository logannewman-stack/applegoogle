<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northstar</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="black" d="M12 1l2.4 8.6L23 12l-8.6 2.4L12 23l-2.4-8.6L1 12l8.6-2.4z"/></svg>'>
<style>
  :root {
    --ink: #111111;
    --paper: #ffffff;
    --faint: #757575;
    --line: #e2e2e2;
    --wash: #f6f6f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f2f2; --paper: #0d0d0d; --faint: #9a9a9a; --line: #262626; --wash: #171717; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Tab bar ─────────────────────────────────────────────── */
  .tabbar {
    width: 100%;
    flex: none;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.55rem 0.8rem 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tabrule { flex: none; width: 100%; border-bottom: 1px solid var(--line); }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    max-width: 13rem;
    padding: 0.38rem 0.7rem 0.38rem 0.9rem;
    border: 1px solid var(--line);
    border-radius: 8px 8px 0 0;
    border-bottom: none;
    background: var(--wash);
    color: var(--faint);
    font-size: 0.78rem;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    flex: none;
  }
  .tab.active { background: var(--paper); color: var(--ink); border-color: var(--ink); }
  .tab .label { overflow: hidden; text-overflow: ellipsis; max-width: 9.5rem; }
  .tab .close {
    border: none; background: none; color: inherit; cursor: pointer;
    font-size: 0.85rem; line-height: 1; padding: 0.1rem 0.15rem; border-radius: 4px;
  }
  .tab .close:hover { background: var(--line); }
  .newtab {
    border: 1px solid var(--line); background: none; color: var(--faint);
    border-radius: 8px; width: 1.7rem; height: 1.7rem; cursor: pointer;
    font-size: 1rem; line-height: 1; flex: none;
  }
  .newtab:hover { color: var(--ink); border-color: var(--ink); }

  /* ── Layout ──────────────────────────────────────────────── */
  main { width: min(660px, 92vw); display: flex; flex-direction: column; flex: 1; }
  .home-mode { justify-content: center; }

  .brand {
    display: flex; align-items: center; justify-content: center; gap: 0.55rem;
    margin-bottom: 1.1rem; user-select: none; cursor: pointer;
  }
  .brand svg { width: 1.6rem; height: 1.6rem; }
  .brand .name { font-weight: 600; letter-spacing: 0.01em; font-size: 2rem; }
  .results-mode .brand { justify-content: flex-start; margin: 1.6rem 0 1.2rem; }
  .results-mode .brand svg { width: 1.05rem; height: 1.05rem; }
  .results-mode .brand .name { font-size: 1.05rem; }

  .greeting {
    text-align: center; color: var(--faint); font-size: 0.95rem;
    margin-bottom: 1.9rem; min-height: 1.2em;
  }
  .results-mode .greeting { display: none; }

  form { width: 100%; }
  .box {
    display: flex; align-items: center; gap: 0.75rem;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 0.85rem 1.4rem; transition: border-color 0.15s ease;
    background: var(--paper);
  }
  .box:focus-within { border-color: var(--ink); }
  .box svg { flex: none; opacity: 0.45; }
  input[type="text"], input[type="email"] {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--ink); font: inherit; font-size: 1.05rem; min-width: 0;
  }
  input::placeholder { color: var(--faint); }

  /* ── First stars (suggested searches) ────────────────────── */
  .firststars { margin-top: 1.9rem; text-align: center; }
  .firststars .lead {
    font-size: 0.78rem; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.7rem;
  }
  .starchips { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
  .starchip {
    border: 1px solid var(--line); background: none; color: var(--ink);
    border-radius: 999px; padding: 0.45rem 0.95rem; font: inherit;
    font-size: 0.85rem; cursor: pointer;
  }
  .starchip:hover { border-color: var(--ink); }

  /* ── History (home) ──────────────────────────────────────── */
  .history { margin-top: 2rem; }
  .history .head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.78rem; color: var(--faint);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
  }
  .linklike {
    border: none; background: none; color: var(--faint); cursor: pointer;
    font: inherit; font-size: 0.78rem; text-decoration: underline; text-underline-offset: 2px;
  }
  .linklike:hover { color: var(--ink); }
  .history ul { list-style: none; }
  .history li {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    padding: 0.5rem 0.2rem; border-bottom: 1px solid var(--line);
    font-size: 0.95rem; cursor: pointer;
  }
  .history li:hover .q { text-decoration: underline; text-underline-offset: 2px; }
  .history li .when { color: var(--faint); font-size: 0.75rem; flex: none; }
  .history li .rm {
    border: none; background: none; color: var(--faint); cursor: pointer;
    font-size: 0.85rem; padding: 0 0.2rem; visibility: hidden;
  }
  .history li:hover .rm { visibility: visible; }

  /* ── Results ─────────────────────────────────────────────── */
  .results-meta { color: var(--faint); font-size: 0.8rem; margin: 1.5rem 0 0.3rem; }
  .result { padding: 1.05rem 0; border-bottom: 1px solid var(--line); }
  .result:last-child { border-bottom: none; }
  .result .site { font-size: 0.78rem; color: var(--faint); margin-bottom: 0.15rem; overflow-wrap: anywhere; }
  .result a.title { color: var(--ink); font-size: 1.08rem; font-weight: 600; text-decoration: none; }
  .result a.title:hover { text-decoration: underline; }
  .result .snippet { margin-top: 0.3rem; font-size: 0.92rem; line-height: 1.5; opacity: 0.82; }
  .result .snippet b { font-weight: 600; }
  .whybtn {
    margin-top: 0.45rem; border: none; background: none; color: var(--faint);
    font-size: 0.78rem; cursor: pointer; padding: 0;
  }
  .whybtn:hover { color: var(--ink); }
  .why {
    display: none; margin-top: 0.5rem; padding: 0.7rem 0.9rem;
    border-left: 2px solid var(--ink); background: var(--wash);
    font-size: 0.85rem; line-height: 1.55; border-radius: 0 6px 6px 0;
  }
  .why.open { display: block; }
  .why .factors { margin-top: 0.4rem; color: var(--faint); font-size: 0.76rem; }
  .empty { color: var(--faint); padding: 2rem 0; text-align: center; font-size: 0.95rem; }

  footer {
    width: min(660px, 92vw); padding: 1.3rem 0 1.6rem;
    display: flex; flex-direction: column; gap: 0.35rem; align-items: center;
    color: var(--faint); font-size: 0.75rem; text-align: center; letter-spacing: 0.01em;
  }
  footer .links { display: flex; gap: 1rem; }

  /* ══ The story — first-run cinematic onboarding ═══════════ */
  #story {
    position: fixed; inset: 0; z-index: 50;
    background: #050507;
    color: #f4f4f2;
    overflow: hidden;
    transition: background 1.4s ease;
  }
  #story.dawn { background: var(--paper); }
  #story.dawn .scene, #story.dawn .dots, #story.dawn #storySkip, #story.dawn #sky { opacity: 0; transition: opacity 0.9s ease; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; }

  #storySkip {
    position: absolute; top: 1.1rem; right: 1.4rem; z-index: 3;
    border: none; background: none; color: rgba(244,244,242,0.68);
    font: inherit; font-size: 0.8rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  #storySkip:hover { color: #f4f4f2; }

  .scene {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    /* justify via .inner margin:auto — centers when it fits, scrolls when it doesn't */
    overflow-y: auto;
    text-align: center; padding: 2rem;
    animation: sceneIn 0.9s ease both;
  }
  @keyframes sceneIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .scene .inner { max-width: 34rem; margin: auto; display: flex; flex-direction: column; align-items: center; gap: 1.3rem; }
  .scene h2 {
    font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 600;
    letter-spacing: 0.01em; line-height: 1.25;
    animation: settle 1.1s ease both;
  }
  @keyframes settle {
    from { letter-spacing: 0.18em; opacity: 0; filter: blur(4px); }
    to { letter-spacing: 0.01em; opacity: 1; filter: blur(0); }
  }
  .scene .body { font-size: 1.02rem; line-height: 1.75; color: rgba(244,244,242,0.78); }
  .scene .body p { animation: lineIn 0.8s ease both; }
  .scene .body p:nth-child(2) { animation-delay: 0.55s; }
  .scene .body p:nth-child(3) { animation-delay: 1.1s; }
  @keyframes lineIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .scene.mega h2 {
    font-size: clamp(2rem, 7vw, 3.6rem);
    letter-spacing: 0.14em;
    line-height: 1.3;
  }
  .scene.mega h2 span { display: inline-block; animation: starIn 0.7s ease both; }
  @keyframes starIn { from { opacity: 0; filter: blur(8px); transform: translateY(6px); } to { opacity: 1; filter: blur(0); transform: none; } }

  .scene .controls {
    display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
    margin-top: 0.4rem; animation: lineIn 0.8s ease 1s both;
  }
  .sbtn {
    border: 1px solid rgba(244,244,242,0.9); background: #f4f4f2; color: #0a0a0c;
    border-radius: 999px; padding: 0.7rem 1.9rem; font: inherit; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: transform 0.15s ease;
  }
  .sbtn:hover { transform: translateY(-1px); }
  .sbtn[disabled] { opacity: 0.55; cursor: default; transform: none; }
  .sghost {
    border: none; background: none; color: rgba(244,244,242,0.66);
    font: inherit; font-size: 0.82rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .sghost:hover { color: #f4f4f2; }

  .sinput {
    width: min(22rem, 80vw);
    border: none; border-bottom: 1px solid rgba(244,244,242,0.35);
    background: transparent; color: #f4f4f2; text-align: center;
    font: inherit; font-size: 1.25rem; padding: 0.45rem 0.2rem; outline: none;
    transition: border-color 0.2s ease;
  }
  .sinput:focus { border-color: #f4f4f2; }
  .privacy { font-size: 0.78rem; color: rgba(244,244,242,0.6); max-width: 24rem; line-height: 1.6; }
  .serror { font-size: 0.82rem; color: rgba(244,244,242,0.85); border-bottom: 1px solid rgba(244,244,242,0.3); padding-bottom: 2px; min-height: 1.1em; }

  .chasechips { display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center; max-width: 30rem; }
  .chasechip {
    border: 1px solid rgba(244,244,242,0.35); background: transparent; color: rgba(244,244,242,0.85);
    border-radius: 999px; padding: 0.5rem 1.05rem; font: inherit; font-size: 0.88rem; cursor: pointer;
    transition: all 0.15s ease;
  }
  .chasechip:hover { border-color: #f4f4f2; }
  .chasechip.on { background: #f4f4f2; color: #0a0a0c; border-color: #f4f4f2; }

  .keypanel {
    display: flex; flex-direction: column; gap: 0.9rem; align-items: center;
    animation: lineIn 0.7s ease both;
  }
  .keypanel code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9rem; background: rgba(244,244,242,0.08);
    border: 1px solid rgba(244,244,242,0.25); border-radius: 8px;
    padding: 0.6rem 0.9rem; user-select: all; overflow-wrap: anywhere; max-width: 80vw;
  }

  .dots {
    position: absolute; bottom: 2rem; left: 0; right: 0; z-index: 2;
    display: flex; gap: 0.5rem; justify-content: center;
  }
  .dots i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(244,244,242,0.25); transition: background 0.3s ease, transform 0.3s ease;
  }
  .dots i.on { background: #f4f4f2; transform: scale(1.35); }

  @media (prefers-reduced-motion: reduce) {
    .scene, .scene h2, .scene .body p, .scene .controls, .scene.mega h2 span, .keypanel { animation: none; }
    #story, #story.dawn .scene { transition: none; }
  }
</style>
</head>
<body>
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Search tabs"></nav>
  <div class="tabrule"></div>

  <main id="main" class="home-mode">
    <div class="brand" id="brand" title="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1l2.4 8.6L23 12l-8.6 2.4L12 23l-2.4-8.6L1 12l8.6-2.4z"/></svg>
      <span class="name">Northstar</span>
    </div>
    <div class="greeting" id="greeting"></div>

    <form id="form" autocomplete="off">
      <div class="box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input id="q" type="text" placeholder="Search">
      </div>
    </form>

    <section class="firststars" id="firstStars" hidden>
      <div class="lead" id="firstStarsLead"></div>
      <div class="starchips" id="starChips"></div>
    </section>

    <section class="history" id="historyBlock" hidden>
      <div class="head"><span>Recent</span><button class="linklike" id="clearHistory">Clear all</button></div>
      <ul id="historyList"></ul>
    </section>

    <div class="results-meta" id="meta" hidden></div>
    <div id="results"></div>
  </main>

  <footer>
    <div>No ads. No sponsored results. Nothing is for sale on this page — results are ranked by relevance alone, and every result explains why it's here.</div>
    <div class="links">
      <button class="linklike" id="privateToggle">Private mode: off</button>
      <button class="linklike" id="replayStory">Replay the story</button>
      <button class="linklike" id="accountStatus" hidden></button>
    </div>
  </footer>

  <!-- ══ First light: the story ═══════════════════════════════ -->
  <div id="story" role="dialog" aria-modal="true" aria-label="Welcome to Northstar" hidden>
    <canvas id="sky" aria-hidden="true"></canvas>
    <button id="storySkip">Skip the story</button>
    <div id="scene"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

<script>
(() => {
  'use strict';

  // ════ The story: copy ═══════════════════════════════════════
  const STORY = {
    beats: [
      { id: 'arrival', headline: 'Look up',
        body: 'For most of human history, anyone who was lost looked up.\nThe sky belonged to everyone. It asked for nothing back.' },
      { id: 'problem', headline: 'Then, quietly, it was sold',
        body: 'Every answer had a sponsor. Every question had a price.\nNot evil. Just a business model. But you were not the customer — you were the inventory.' },
      { id: 'promise', headline: 'Here, you are the only customer',
        body: 'You pay a small subscription, so Northstar answers to you alone.\nEvery result carries a receipt: the exact reason it was chosen. Nothing here can be bought.' },
      { id: 'name', headline: 'What should we call you?',
        body: 'Only so we can greet you.\nYour name stays on this device unless you choose to make an account.',
        placeholder: 'Your first name', primary: "That's me", secondary: "I'd rather not say",
        privacyNote: 'Used only to greet you. It never leaves this device unless you make an account. Erasable anytime.' },
      { id: 'account', headline: 'Your sky, on every screen',
        body: 'An email is all we ask. Your history and settings will follow you.\nNo account works too. Both are fine ways to live.',
        placeholder: 'you@anywhere.com', primary: 'Create account', secondary: 'Continue without one',
        privacyNote: 'Your email is for signing in. Not for mail, not for tracking, not for sale. Skipping changes nothing about your results.' },
      { id: 'chase', headline: 'What do you chase?',
        body: 'Choose up to three.\nThey shape your first suggested searches — nothing more. They never touch how results are ranked.',
        primary: 'Set my course', secondary: "I'll wander",
        privacyNote: 'Used once, to suggest first searches. Ranking cannot be bought or bent — not even by you.' },
      { id: 'tagline', headline: 'NOBODY CAN BUY THE SKY',
        body: 'It was never theirs to sell.', primary: 'Start searching truly' },
    ],
    skipStory: 'Skip the story',
    accountSuccess: 'This is your key. We show it once and keep no copy — that is what private means. Save it somewhere safe before you continue.',
    accountExists: 'This email already has an account. Paste your key below to sign in — your sky is where you left it.',
    greetings: {
      morning: 'Morning, {name}. Clear skies.',
      afternoon: 'Afternoon, {name}. Where to?',
      evening: 'Evening, {name}. The stars are out.',
      nameless: 'The sky is yours. Ask it anything.',
    },
    firstSearchLeadIn: 'A few first stars to steer by',
  };

  const INTERESTS = [
    'How things work', 'Other worlds', 'Good food', 'Code',
    'Wild places', 'Old stories', 'New music', 'The human mind',
  ];
  const INTEREST_QUERIES = {
    'How things work': ['how the javascript event loop works', 'how espresso extraction works'],
    'Other worlds': ['ev charging on road trips', 'hiking a fourteener'],
    'Good food': ['pour over coffee', 'sourdough starter'],
    'Code': ['javascript closures', 'event loop microtasks'],
    'Wild places': ['first fourteener', 'altitude sickness signs'],
    'Old stories': ['why ad-free search matters', 'light roast coffee origins'],
    'New music': ['principles of minimalist design', 'monochrome aesthetics'],
    'The human mind': ['why minimalism builds trust', 'signs of altitude sickness'],
  };
  const DEFAULT_QUERIES = ['pour over coffee', 'javascript closures', 'why ad-free search matters', 'minimalist design'];

  // ════ Shared state ═══════════════════════════════════════════
  const STORE_KEY = 'northstar.tabs.v1';
  const KEY_ONBOARDED = 'northstar.onboarded';
  const KEY_NAME = 'northstar.name';
  const KEY_INTERESTS = 'northstar.interests';

  let state = { tabs: [], active: null };
  let privateMode = false;

  const $ = (id) => document.getElementById(id);
  const els = {
    tabbar: $('tabbar'), main: $('main'), brand: $('brand'), form: $('form'), q: $('q'),
    greeting: $('greeting'), firstStars: $('firstStars'), firstStarsLead: $('firstStarsLead'), starChips: $('starChips'),
    historyBlock: $('historyBlock'), historyList: $('historyList'), clearHistory: $('clearHistory'),
    meta: $('meta'), results: $('results'),
    privateToggle: $('privateToggle'), replayStory: $('replayStory'), accountStatus: $('accountStatus'),
    story: $('story'), sky: $('sky'), storySkip: $('storySkip'), scene: $('scene'), dots: $('dots'),
  };

  const uid = () => Math.random().toString(36).slice(2, 10);
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ════ Tabs & app (search, history, results) ══════════════════
  function loadState() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY));
      if (raw && Array.isArray(raw.tabs) && raw.tabs.length > 0) {
        state = raw;
        if (!state.tabs.some((t) => t.id === state.active)) state.active = state.tabs[0].id;
        return;
      }
    } catch {}
    state = { tabs: [{ id: uid(), q: '', data: null }], active: null };
    state.active = state.tabs[0].id;
  }

  function saveState() {
    const slim = {
      active: state.active,
      tabs: state.tabs.map((t, i) => ({
        id: t.id, q: t.q,
        data: (privateMode || state.tabs.length - i > 8) ? null : t.data,
      })),
    };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(slim)); } catch {}
  }

  const activeTab = () => state.tabs.find((t) => t.id === state.active);

  function renderTabs() {
    els.tabbar.innerHTML = '';
    for (const tab of state.tabs) {
      const el = document.createElement('div');
      el.className = 'tab' + (tab.id === state.active ? ' active' : '');
      el.setAttribute('role', 'tab');
      el.setAttribute('aria-selected', tab.id === state.active);
      el.innerHTML = `<span class="label">${escapeHtml(tab.q || 'New tab')}</span>` +
        (state.tabs.length > 1 ? '<button class="close" aria-label="Close tab">×</button>' : '');
      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('close')) { closeTab(tab.id); return; }
        if (tab.id !== state.active) { state.active = tab.id; saveState(); render(); }
      });
      els.tabbar.appendChild(el);
    }
    const plus = document.createElement('button');
    plus.className = 'newtab';
    plus.textContent = '+';
    plus.setAttribute('aria-label', 'New tab');
    plus.addEventListener('click', newTab);
    els.tabbar.appendChild(plus);
  }

  function newTab() {
    const tab = { id: uid(), q: '', data: null };
    state.tabs.push(tab);
    state.active = tab.id;
    saveState();
    render();
    els.q.focus();
  }

  function closeTab(id) {
    const idx = state.tabs.findIndex((t) => t.id === id);
    state.tabs.splice(idx, 1);
    if (state.active === id) state.active = (state.tabs[idx] || state.tabs[idx - 1]).id;
    saveState();
    render();
  }

  function greetingText() {
    const name = localStorage.getItem(KEY_NAME);
    if (!name) return STORY.greetings.nameless;
    const h = new Date().getHours();
    const t = h < 12 ? STORY.greetings.morning : h < 18 ? STORY.greetings.afternoon : STORY.greetings.evening;
    return t.replace('{name}', name);
  }

  function renderFirstStars(historyCount) {
    let interests = [];
    try { interests = JSON.parse(localStorage.getItem(KEY_INTERESTS)) || []; } catch {}
    if (historyCount >= 3) { els.firstStars.hidden = true; return; }
    const queries = [];
    for (const interest of interests) {
      for (const q of INTEREST_QUERIES[interest] || []) {
        if (!queries.includes(q)) queries.push(q);
      }
    }
    if (queries.length === 0) queries.push(...DEFAULT_QUERIES);
    els.firstStarsLead.textContent = STORY.firstSearchLeadIn;
    els.starChips.innerHTML = '';
    for (const q of queries.slice(0, 6)) {
      const b = document.createElement('button');
      b.className = 'starchip';
      b.textContent = q;
      b.addEventListener('click', () => { els.q.value = q; runSearch(q); });
      els.starChips.appendChild(b);
    }
    els.firstStars.hidden = false;
  }

  function render() {
    renderTabs();
    const tab = activeTab();
    els.q.value = tab.q || '';
    if (tab.q && tab.data) {
      els.main.className = 'results-mode';
      els.historyBlock.hidden = true;
      els.firstStars.hidden = true;
      renderResults(tab.data, { fromCache: !!tab.fromCache });
    } else {
      els.main.className = 'home-mode';
      els.greeting.textContent = greetingText();
      els.meta.hidden = true;
      els.results.innerHTML = '';
      refreshHistory();
    }
  }

  function renderResults(data, { fromCache = false } = {}) {
    els.meta.hidden = false;
    const bits = [];
    if (data.total !== undefined) bits.push(`${data.total} ${data.total === 1 ? 'result' : 'results'}`);
    if (data.tookMs !== undefined) bits.push(`${data.tookMs} ms`);
    if (data.cached) bits.push('server cache');
    if (fromCache) bits.push('restored from this tab’s cache — search again to refresh');
    if (data.private) bits.push('private — not saved to history');
    els.meta.textContent = bits.join(' · ');

    if (!data.results || data.results.length === 0) {
      els.results.innerHTML = '<div class="empty">Nothing matched. The index may still be small — crawl more of the web.</div>';
      return;
    }

    els.results.innerHTML = data.results.map((r, i) => `
      <div class="result">
        <div class="site">${escapeHtml(r.domain)}</div>
        <a class="title" href="${escapeHtml(r.url)}" rel="noopener">${escapeHtml(r.title)}</a>
        <div class="snippet">${highlight(r.snippet, data.normalizedTerms || [])}</div>
        ${r.why ? `
          <button class="whybtn" data-why="${i}" aria-expanded="false">Why this result ▸</button>
          <div class="why" id="why-${i}">
            ${escapeHtml(r.why.summary)}
            <div class="factors">Text relevance ${r.why.factors.textRelevance}
              · link authority ×${r.why.factors.linkAuthority}
              · phrase ×${r.why.factors.phraseProximity}
              · freshness ×${r.why.factors.freshness}</div>
          </div>` : ''}
      </div>`).join('');

    for (const btn of els.results.querySelectorAll('.whybtn')) {
      btn.addEventListener('click', () => {
        const panel = $(`why-${btn.dataset.why}`);
        const open = panel.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
        btn.textContent = open ? 'Why this result ▾' : 'Why this result ▸';
      });
    }
  }

  // Match against the RAW text, escaping each piece separately — running a
  // regex over already-escaped HTML would bold the insides of entities.
  function highlight(text, terms) {
    const valid = [...new Set(terms.filter((t) => t.length >= 2))]
      .map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (valid.length === 0) return escapeHtml(text);
    const re = new RegExp('(^|[^\\w])((?:' + valid.join('|') + ')[\\w]*)', 'gi');
    let out = '';
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      const start = m.index + m[1].length;
      out += escapeHtml(text.slice(last, start)) + '<b>' + escapeHtml(m[2]) + '</b>';
      last = start + m[2].length;
    }
    return out + escapeHtml(text.slice(last));
  }

  async function runSearch(q) {
    const tab = activeTab();
    tab.q = q;
    tab.fromCache = false;
    renderTabs();
    // The user may switch tabs while the fetch is in flight — only touch the
    // visible DOM if this tab is still the active one when it resolves.
    const stillActive = () => state.active === tab.id;
    let data;
    try {
      const res = await fetch(`/v1/search?q=${encodeURIComponent(q)}${privateMode ? '&private=1' : ''}`);
      data = await res.json().catch(() => ({}));
      if (!res.ok) {
        tab.data = null;
        saveState();
        if (stillActive()) {
          els.main.className = 'results-mode';
          els.historyBlock.hidden = true;
          els.firstStars.hidden = true;
          els.meta.hidden = true;
          els.results.innerHTML = `<div class="empty">${escapeHtml(data.error?.message || 'Something went wrong.')}</div>`;
          renderTabs();
        }
        return;
      }
    } catch {
      if (stillActive()) {
        els.results.innerHTML = '<div class="empty">Could not reach the server.</div>';
      }
      return;
    }
    tab.data = data;
    saveState();
    if (stillActive()) render();
  }

  async function refreshHistory() {
    let historyCount = 0;
    if (privateMode) {
      els.historyBlock.hidden = true;
      renderFirstStars(0);
      return;
    }
    try {
      const res = await fetch('/v1/history?limit=8');
      const { history } = await res.json();
      // The user may have started a search while this was in flight; never
      // paint home furniture over a results view.
      if (els.main.className !== 'home-mode') return;
      historyCount = history?.length || 0;
      if (!history || history.length === 0) {
        els.historyBlock.hidden = true;
      } else {
        els.historyBlock.hidden = false;
        els.historyList.innerHTML = history.map((h) => `
          <li data-q="${escapeHtml(h.query)}">
            <span class="q">${escapeHtml(h.query)}</span>
            <span class="when">${timeAgo(h.lastSearchedAt)}</span>
            <button class="rm" aria-label="Remove from history">×</button>
          </li>`).join('');
        for (const li of els.historyList.querySelectorAll('li')) {
          li.addEventListener('click', async (e) => {
            const q = li.dataset.q;
            if (e.target.classList.contains('rm')) {
              await fetch(`/v1/history?query=${encodeURIComponent(q)}`, { method: 'DELETE' });
              refreshHistory();
              return;
            }
            els.q.value = q;
            runSearch(q);
          });
        }
      }
    } catch {
      if (els.main.className !== 'home-mode') return;
      els.historyBlock.hidden = true;
    }
    if (els.main.className === 'home-mode') renderFirstStars(historyCount);
  }

  function timeAgo(iso) {
    const s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  let sessionAccount = null; // the account this browser is signed in as, if any

  async function refreshAccountStatus() {
    try {
      const res = await fetch('/v1/session');
      const data = await res.json();
      if (!res.ok || !data.signedIn) { sessionAccount = null; els.accountStatus.hidden = true; return; }
      sessionAccount = data.account;
      els.accountStatus.hidden = false;
      els.accountStatus.textContent = `${data.account.email} · Sign out`;
      els.accountStatus.onclick = async () => {
        await fetch('/v1/account/logout', { method: 'POST' });
        sessionAccount = null;
        els.accountStatus.hidden = true;
      };
    } catch { sessionAccount = null; els.accountStatus.hidden = true; }
  }

  // ════ The story engine ═══════════════════════════════════════
  const story = {
    idx: 0,
    open: false,
    busy: false, //     an account request is in flight — closing would lose it
    keyShown: false, // the one-time key is on screen — it must be acknowledged
    chosen: new Set(),
    skyStop: null,
  };

  // While the dialog is open, the app behind it must be inert to keyboards
  // and screen readers alike.
  function setBackgroundInert(on) {
    for (const el of [els.tabbar, els.main, document.querySelector('footer')]) {
      if (!el) continue;
      if ('inert' in el) el.inert = on;
      if (on) el.setAttribute('aria-hidden', 'true');
      else el.removeAttribute('aria-hidden');
    }
  }

  function storyOpen() {
    if (story.open) return;
    story.open = true;
    story.busy = false;
    story.keyShown = false;
    story.idx = 0;
    try { story.chosen = new Set(JSON.parse(localStorage.getItem(KEY_INTERESTS)) || []); }
    catch { story.chosen = new Set(); }
    els.story.hidden = false;
    document.body.style.overflow = 'hidden';
    setBackgroundInert(true);
    els.storySkip.textContent = STORY.skipStory;
    els.dots.innerHTML = STORY.beats.map(() => '<i></i>').join('');
    if (story.skyStop) story.skyStop();
    story.skyStop = startSky(els.sky);
    renderBeat();
  }

  function storyClose() {
    // Never close over an in-flight account request or an unacknowledged
    // one-time key — that would silently lose the account.
    if (story.busy || story.keyShown) return;
    // Dawn: the night lifts and the app is simply there.
    els.story.classList.add('dawn');
    localStorage.setItem(KEY_ONBOARDED, '1');
    setTimeout(() => {
      els.story.hidden = true;
      els.story.classList.remove('dawn');
      document.body.style.overflow = '';
      setBackgroundInert(false);
      story.open = false;
      if (story.skyStop) { story.skyStop(); story.skyStop = null; }
      render();
      refreshAccountStatus();
      els.q.focus();
    }, reducedMotion ? 0 : 1100);
  }

  function beatDots() {
    [...els.dots.children].forEach((d, i) => d.classList.toggle('on', i === story.idx));
  }

  function advance() {
    if (story.idx >= STORY.beats.length - 1) { storyClose(); return; }
    story.idx++;
    renderBeat();
  }

  function controlsHtml(beat, { primaryDisabled = false } = {}) {
    return `<div class="controls">
      ${beat.placeholder && beat.id !== 'chase' ? `<input class="sinput" id="beatInput" type="${beat.id === 'account' ? 'email' : 'text'}" placeholder="${escapeHtml(beat.placeholder)}" autocomplete="${beat.id === 'account' ? 'email' : 'given-name'}">` : ''}
      <div class="serror" id="beatError" role="alert"></div>
      <button class="sbtn" id="beatPrimary" ${primaryDisabled ? 'disabled' : ''}>${escapeHtml(beat.primary)}</button>
      ${beat.secondary ? `<button class="sghost" id="beatSecondary">${escapeHtml(beat.secondary)}</button>` : ''}
      ${beat.privacyNote ? `<div class="privacy">${escapeHtml(beat.privacyNote)}</div>` : ''}
    </div>`;
  }

  function renderBeat() {
    const beat = STORY.beats[story.idx];
    beatDots();
    skyProgress(story.idx / (STORY.beats.length - 1), beat.id === 'tagline');

    // Already signed in? The account beat becomes a welcome-back, so a
    // replay can never accidentally create a second account.
    if (beat.id === 'account' && sessionAccount) {
      els.scene.innerHTML = `<div class="scene"><div class="inner">
        <h2>Your sky is already yours</h2>
        <div class="body"><p>Signed in as ${escapeHtml(sessionAccount.email)}.</p></div>
        <div class="controls"><button class="sbtn" id="beatPrimary">Continue</button></div>
      </div></div>`;
      const btn = $('beatPrimary');
      btn.addEventListener('click', advance);
      setTimeout(() => btn.focus(), reducedMotion ? 0 : 650);
      return;
    }

    const bodyHtml = `<div class="body">${beat.body.split('\n').map((l) => `<p>${escapeHtml(l)}</p>`).join('')}</div>`;
    let html;

    if (beat.id === 'tagline') {
      const letters = [...beat.headline].map((ch, i) =>
        ch === ' ' ? '<span>&nbsp;</span>' : `<span style="animation-delay:${(i * 55)}ms">${escapeHtml(ch)}</span>`).join('');
      html = `<div class="scene mega"><div class="inner">
        <h2 aria-label="${escapeHtml(beat.headline)}">${letters}</h2>
        ${bodyHtml}
        <div class="controls" style="animation-delay:${reducedMotion ? 0 : 1400}ms">
          <button class="sbtn" id="beatPrimary">${escapeHtml(beat.primary)}</button>
        </div>
      </div></div>`;
    } else if (beat.id === 'chase') {
      const chips = INTERESTS.map((c) =>
        `<button class="chasechip${story.chosen.has(c) ? ' on' : ''}" data-c="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
      html = `<div class="scene"><div class="inner">
        <h2>${escapeHtml(beat.headline)}</h2>
        ${bodyHtml}
        <div class="chasechips" id="chips">${chips}</div>
        ${controlsHtml(beat)}
      </div></div>`;
    } else if (beat.primary) {
      html = `<div class="scene"><div class="inner">
        <h2>${escapeHtml(beat.headline)}</h2>
        ${bodyHtml}
        ${controlsHtml(beat)}
      </div></div>`;
    } else {
      html = `<div class="scene"><div class="inner">
        <h2>${escapeHtml(beat.headline)}</h2>
        ${bodyHtml}
        <div class="controls"><button class="sbtn" id="beatPrimary">Continue</button></div>
      </div></div>`;
    }

    els.scene.innerHTML = html;
    wireBeat(beat);
  }

  function wireBeat(beat) {
    const input = $('beatInput');
    const err = $('beatError');
    const primary = $('beatPrimary');
    const secondary = $('beatSecondary');

    // Move focus into the dialog on every beat — the input where there is
    // one, the primary action otherwise.
    const focusTarget = input || primary || els.storySkip;
    if (focusTarget) setTimeout(() => focusTarget.focus(), reducedMotion ? 0 : 650);
    if (input && primary) {
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); primary.click(); } });
    }

    if (beat.id === 'name') {
      primary.addEventListener('click', () => {
        const name = input.value.trim().slice(0, 60);
        if (name) localStorage.setItem(KEY_NAME, name);
        advance();
      });
      secondary.addEventListener('click', () => { localStorage.removeItem(KEY_NAME); advance(); });
    } else if (beat.id === 'account') {
      primary.addEventListener('click', async () => {
        const email = input.value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'That email doesn’t look complete.'; return; }
        story.busy = true; // block skip/Escape — closing now would lose the key
        primary.disabled = true;
        primary.textContent = 'Creating…';
        try {
          const res = await fetch('/v1/account', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email, name: localStorage.getItem(KEY_NAME) || undefined }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 409) {
            err.textContent = STORY.accountExists;
            showSigninPanel(err);
          } else if (!res.ok) {
            err.textContent = data.error?.message || 'Something went wrong.';
          } else {
            story.busy = false;
            sessionAccount = data.account ? { email: data.account.email, name: data.account.name, plan: data.account.plan } : sessionAccount;
            showKeyPanel(data.apiKey);
            return;
          }
        } catch { err.textContent = 'Could not reach the server.'; }
        story.busy = false;
        primary.disabled = false;
        primary.textContent = beat.primary;
      });
      secondary.addEventListener('click', advance);
    } else if (beat.id === 'chase') {
      for (const chip of $('chips').querySelectorAll('.chasechip')) {
        chip.addEventListener('click', () => {
          const c = chip.dataset.c;
          if (story.chosen.has(c)) { story.chosen.delete(c); chip.classList.remove('on'); }
          else if (story.chosen.size < 3) { story.chosen.add(c); chip.classList.add('on'); }
        });
      }
      primary.addEventListener('click', () => {
        localStorage.setItem(KEY_INTERESTS, JSON.stringify([...story.chosen]));
        advance();
      });
      secondary.addEventListener('click', () => {
        localStorage.setItem(KEY_INTERESTS, '[]');
        advance();
      });
    } else if (primary) {
      primary.addEventListener('click', advance);
    }
  }

  // The 409 path: an inline sign-in, so an existing account is a doorway,
  // not a dead end.
  function showSigninPanel(err) {
    if ($('signinKey')) { $('signinKey').focus(); return; }
    const wrap = document.createElement('div');
    wrap.className = 'controls';
    wrap.style.animation = 'none';
    wrap.innerHTML = `
      <input class="sinput" id="signinKey" type="text" placeholder="ns_…  your saved key" autocomplete="off">
      <button class="sbtn" id="signinBtn">Sign in with my key</button>`;
    err.insertAdjacentElement('afterend', wrap);
    const keyInput = $('signinKey');
    const btn = $('signinBtn');
    keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); btn.click(); } });
    btn.addEventListener('click', async () => {
      const apiKey = keyInput.value.trim();
      if (!apiKey) { err.textContent = 'Paste the key you saved when the account was made.'; return; }
      btn.disabled = true;
      try {
        const res = await fetch('/v1/session/signin', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ apiKey }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.signedIn) {
          sessionAccount = data.account;
          advance();
          return;
        }
        err.textContent = data.error?.message || 'That key didn’t match.';
      } catch { err.textContent = 'Could not reach the server.'; }
      btn.disabled = false;
    });
    keyInput.focus();
  }

  // After account creation: show the one-time key with due ceremony.
  // Skip/Escape are disabled until it is acknowledged — this key cannot be
  // shown twice, so it must not be lost to a stray keypress.
  function showKeyPanel(apiKey) {
    story.keyShown = true;
    const inner = els.scene.querySelector('.inner');
    inner.innerHTML = `
      <h2>Welcome aboard</h2>
      <div class="keypanel">
        <div class="body"><p>${escapeHtml(STORY.accountSuccess)}</p></div>
        <code>${escapeHtml(apiKey)}</code>
        <div class="controls" style="animation:none">
          <button class="sbtn" id="keyCopy">Copy key</button>
          <button class="sghost" id="keyDone">I saved it — continue</button>
        </div>
      </div>`;
    $('keyCopy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(apiKey); $('keyCopy').textContent = 'Copied'; } catch {}
    });
    $('keyDone').addEventListener('click', () => { story.keyShown = false; advance(); });
    $('keyCopy').focus();
  }

  // ════ The sky: starfield canvas ══════════════════════════════
  let skyState = { progress: 0, flare: false };
  function skyProgress(p, flare) { skyState = { progress: p, flare }; }

  function startSky(canvas) {
    const ctx = canvas.getContext('2d');
    let raf = null;
    let stars = [];
    let w = 0, h = 0, dpr = 1;
    let px = 0, py = 0; // pointer parallax, -0.5..0.5

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = [];
      const count = Math.min(260, Math.round((w * h) / 6500));
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.1 + 0.25,
          depth: Math.random() * 0.8 + 0.2,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.8 + 0.4,
        });
      }
    }

    function onPointer(e) {
      px = e.clientX / w - 0.5;
      py = e.clientY / h - 0.5;
    }

    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      const time = t / 1000;

      for (const s of stars) {
        const tw = reducedMotion ? 0.75 : 0.55 + 0.45 * Math.sin(time * s.speed + s.phase);
        const ox = reducedMotion ? 0 : -px * s.depth * 18;
        const oy = reducedMotion ? 0 : -py * s.depth * 12;
        ctx.globalAlpha = 0.25 + 0.6 * tw * s.depth;
        ctx.fillStyle = '#f4f4f2';
        ctx.beginPath();
        ctx.arc(s.x + ox, s.y + oy, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // The north star: grows as the story progresses, flares at the tagline
      // (rising higher so the glare clears the headline).
      const nx = w / 2;
      const ny = h * (skyState.flare ? 0.14 : 0.30);
      const base = 1.4 + skyState.progress * 2.2;
      const pulse = skyState.flare && !reducedMotion ? 1 + 0.18 * Math.sin(time * 2.2) : 1;
      const R = base * pulse;

      ctx.globalAlpha = 1;
      const grad = ctx.createRadialGradient(nx, ny, 0, nx, ny, R * 16);
      grad.addColorStop(0, 'rgba(244,244,242,0.9)');
      grad.addColorStop(0.15, 'rgba(244,244,242,0.25)');
      grad.addColorStop(1, 'rgba(244,244,242,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(nx - R * 16, ny - R * 16, R * 32, R * 32);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(nx, ny, R, 0, Math.PI * 2);
      ctx.fill();

      // Four-point glare
      ctx.strokeStyle = `rgba(244,244,242,${skyState.flare ? 0.75 : 0.4})`;
      ctx.lineWidth = 1;
      const arm = R * (skyState.flare ? 22 : 12);
      ctx.beginPath();
      ctx.moveTo(nx - arm, ny); ctx.lineTo(nx + arm, ny);
      ctx.moveTo(nx, ny - arm); ctx.lineTo(nx, ny + arm);
      ctx.stroke();

      raf = requestAnimationFrame(frame);
    }

    resize();
    window.addEventListener('resize', resize);
    if (!reducedMotion) window.addEventListener('pointermove', onPointer);
    if (reducedMotion) {
      frame(0);
      cancelAnimationFrame(raf);
      raf = null;
      // Redraw a static frame when the beat changes (progress moved).
      const iv = setInterval(() => { if (!story.open) return; frame(performance.now()); cancelAnimationFrame(raf); raf = null; }, 600);
      return () => { clearInterval(iv); window.removeEventListener('resize', resize); };
    }
    raf = requestAnimationFrame(frame);
    return () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      window.removeEventListener('pointermove', onPointer);
    };
  }

  // ════ Wiring ═════════════════════════════════════════════════
  els.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = els.q.value.trim();
    if (q) runSearch(q);
  });

  els.brand.addEventListener('click', () => {
    const tab = activeTab();
    tab.q = '';
    tab.data = null;
    saveState();
    render();
    els.q.focus();
  });

  els.clearHistory.addEventListener('click', async () => {
    await fetch('/v1/history', { method: 'DELETE' });
    refreshHistory();
  });

  els.privateToggle.addEventListener('click', () => {
    privateMode = !privateMode;
    els.privateToggle.textContent = `Private mode: ${privateMode ? 'on' : 'off'}`;
    if (els.main.className === 'home-mode') refreshHistory();
  });

  els.replayStory.addEventListener('click', storyOpen);
  els.storySkip.addEventListener('click', storyClose);
  document.addEventListener('keydown', (e) => {
    if (story.open && e.key === 'Escape') storyClose();
  });

  // Keep Tab cycling inside the dialog while the story is open.
  els.story.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || !story.open) return;
    const focusables = [...els.story.querySelectorAll('button, input')]
      .filter((el) => !el.disabled && el.getClientRects().length > 0);
    if (focusables.length === 0) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // ════ Boot ═══════════════════════════════════════════════════
  loadState();
  for (const tab of state.tabs) if (tab.data) tab.fromCache = true;
  render();
  refreshAccountStatus();

  const wantsStory = new URLSearchParams(location.search).get('story') === '1';
  if (!localStorage.getItem(KEY_ONBOARDED) || wantsStory) storyOpen();
  else els.q.focus();
})();
</script>
</body>
</html>
